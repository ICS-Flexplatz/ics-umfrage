<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICS Mitarbeiterbefragung 2026</title>
<style>
  :root{
    --teal:#009CC4;
    --teal-deep:#00728F;
    --teal-pale:#E4F5FA;
    --gold:#FAB800;
    --navy:#0E2430;
    --navy-soft:#153342;
    --paper:#F6F9FA;
    --card:#FFFFFF;
    --line:#DEE5E8;
    --text:#141D24;
    --muted:#5C6B73;
    --danger:#C0392B;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--text);
    font-family:Arial, Helvetica, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .app{max-width:900px;margin:0 auto;padding-bottom:60px;}

  /* ---------- Top bar (persistent on all non-hero screens) ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px 14px;
    background:var(--card);
    border-bottom:1px solid var(--line);
  }
  .logo{ display:flex; align-items:center; gap:9px; }
  .logo-mark{
    width:36px; height:36px; border-radius:8px;
    overflow:hidden; flex-shrink:0; box-shadow:0 0 0 1px rgba(0,0,0,.04);
  }
  .logo-mark img{ width:100%; height:100%; display:block; object-fit:cover; }
  .logo-text{ line-height:1.1; }
  .logo-text .ics{ font-weight:900; font-size:17px; color:var(--navy); letter-spacing:.02em; }
  .logo-text .tag{ font-size:9.5px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; }
  .step-count{ font-size:14px; color:var(--muted); font-weight:bold; white-space:nowrap; }

  .progress-track{ height:5px; background:var(--line); }
  .progress-fill{ height:100%; background:linear-gradient(90deg, var(--teal-deep), var(--teal), var(--gold)); transition:width .35s ease; }

  /* ---------- Hero / Intro ---------- */
  .hero-image-wrap{ width:100%; line-height:0; }
  .hero-image-wrap img{ width:100%; display:block; }
  .hero-body{
    background:linear-gradient(155deg, var(--navy) 0%, var(--navy-soft) 100%);
    color:#fff;
    padding:28px 24px 34px;
  }
  .hero-body p{
    font-size:16px; line-height:1.7; color:#C9D9DC; max-width:560px;
    margin:0 0 10px;
  }
  .hero-body .meta-row{
    display:flex; gap:18px; margin-top:20px;
    flex-wrap:wrap;
  }
  .meta-chip{
    font-size:12.5px; color:#fff; background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.22); padding:7px 13px; border-radius:999px;
    display:flex; align-items:center; gap:6px;
  }
  .hero-sign{
    margin-top:24px; font-size:13px; color:#9FB4B8;
  }
  .start-btn{
    margin-top:24px;
    background:var(--gold); color:var(--navy); border:none;
    padding:15px 30px; border-radius:9px; font-size:15.5px; font-weight:900;
    font-family:Arial, Helvetica, sans-serif; cursor:pointer;
  }
  .start-btn:hover{ background:#FFC933; }

  /* ---------- Section screen ---------- */
  .section-head{ padding:28px 24px 8px; }
  .section-head .eyebrow{ font-size:13px; font-weight:bold; color:var(--teal-deep); margin:0 0 8px; }
  .section-head h2{ font-size:25px; margin:0 0 8px; font-weight:900; color:var(--navy); }
  .section-head .sub{ font-size:15.5px; color:var(--muted); margin:0; line-height:1.5; max-width:560px;}

  .qblock{
    background:var(--card); margin:14px 20px; border:1px solid var(--line);
    border-radius:var(--radius); padding:18px 20px 20px;
  }
  .qtext{ font-size:17px; font-weight:bold; line-height:1.5; margin:0 0 18px; color:var(--text); }

  /* Scale 0-5 as square checkboxes */
  .scale-row{ display:flex; gap:10px; margin-bottom:8px; }
  .box{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:8px;
    cursor:pointer; user-select:none;
  }
  .box .sq{
    width:100%; max-width:58px; aspect-ratio:1/1; border-radius:9px;
    border:2.5px solid var(--line); background:var(--paper);
    display:flex; align-items:center; justify-content:center;
    font-weight:bold; font-size:19px; color:var(--muted);
    transition:all .12s ease;
  }
  .box:hover .sq{ border-color:var(--teal); }
  .box.selected .sq{ background:var(--teal); border-color:var(--teal); color:#fff; }
  .scale-caps{ display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-top:4px; }
  .scale-caps span:last-child{ text-align:right; }

  /* Choice questions (single-select list) */
  .choice-list{ display:flex; flex-direction:column; gap:11px; }
  .choice-row{
    display:flex; align-items:center; gap:14px; padding:16px 18px;
    border:1.5px solid var(--line); border-radius:9px; cursor:pointer; user-select:none;
  }
  .choice-row:hover{ border-color:var(--teal); }
  .choice-row.selected{ border-color:var(--teal); background:var(--teal-pale); }
  .choice-box{
    width:24px; height:24px; border-radius:6px; border:2.5px solid var(--line);
    background:#fff; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  }
  .choice-row.selected .choice-box{ background:var(--teal); border-color:var(--teal); }
  .choice-box svg{ display:none; width:15px; height:15px; }
  .choice-row.selected .choice-box svg{ display:block; }
  .choice-label{ font-size:16.5px; }

  /* Mehrfachauswahl */
  .multi-hint{ font-size:14.5px; color:var(--muted); margin:-4px 0 12px; }
  .choice-box-square{ border-radius:4px; }

  textarea{
    width:100%; border:1.5px solid var(--line); border-radius:9px;
    padding:14px 16px; font-family:Arial, Helvetica, sans-serif; font-size:16px;
    resize:vertical; min-height:120px; color:var(--text);
  }

  .skip-note{ font-size:13.5px; color:var(--muted); margin:0 20px 6px; font-style:italic; }

  /* ---------- Nav ---------- */
  .nav-row{ display:flex; gap:12px; padding:18px 20px 6px; align-items:center; }
  .btn{
    font-family:Arial, Helvetica, sans-serif; font-size:16.5px; font-weight:bold;
    padding:16px 26px; border-radius:9px; cursor:pointer; border:none;
  }
  .btn-primary{ background:var(--navy); color:#fff; }
  .btn-primary:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-ghost{ background:none; color:var(--muted); border:1.5px solid var(--line); }
  .nav-hint{ font-size:13.5px; color:var(--muted); margin-left:auto; text-align:right; }

  .foot-note{ text-align:center; font-size:11.5px; color:var(--muted); padding:20px 20px 0; }

  .err{ margin:0 20px 10px; color:var(--danger); font-size:13px; }

  /* ---------- Done ---------- */
  .done{ text-align:center; padding:70px 26px; }
  .done .check{
    width:58px; height:58px; border-radius:50%; background:var(--teal);
    display:flex; align-items:center; justify-content:center; margin:0 auto 20px;
  }
  .done h2{ font-family:Arial, Helvetica, sans-serif; margin:0 0 10px; color:var(--navy); font-size:22px;}
  .done p{ color:var(--muted); margin:0; font-size:14.5px; line-height:1.6; max-width:420px; margin:0 auto;}

  @media (max-width:480px){
    .hero h1{ font-size:24px; }
    .scale-row{ gap:5px; }
    .box .sq{ font-size:12px; border-radius:6px; }
  }
</style>
</head>

// Teilt jeden Abschnitt in Seiten mit maximal 5 Fragen auf, möglichst gleichmäßig verteilt.
const MAX_PER_PAGE = 5;
function buildPages(sections){
  const pages = [];
  sections.forEach(section => {
    const n = section.qs.length;
    const numChunks = Math.ceil(n / MAX_PER_PAGE);
    const chunkSize = Math.ceil(n / numChunks);
    for (let i = 0; i < numChunks; i++){
      const chunkQs = section.qs.slice(i * chunkSize, (i + 1) * chunkSize);
      pages.push({
        title: section.title + (numChunks > 1 ? ` (${i + 1}/${numChunks})` : ""),
        sub: i === 0 ? section.sub : undefined,
        qs: chunkQs
      });
    }
  });
  return pages;
}
const SECTIONS = buildPages(RAW_SECTIONS);

/* =========================================================
   FORMBRICKS-ANBINDUNG  —  fertig eingetragen, nichts zu tun
   =========================================================

   Formbricks-Umfrage geschrieben. Die ID dieses Feldes sucht
   sich die Seite beim Absenden selbst.

const FORMBRICKS_SURVEY_ID = "cmu6nxqaq3ex601w65jnhdllx";

/* =========================================================
   State & Logik
   ========================================================= */
let screen = "intro"; // intro | section | done | error
let sectionIndex = 0;
let answers = {};
let showError = false;
let submitError = "";

function requiredCount(){
  return Object.keys(QUESTIONS).filter(id => {
    const q = QUESTIONS[id];
    if (q.optional) return false;
    if (q.skipIf && q.skipIf(answers)) return false;
    return true;
  }).length;
}

function isAnswered(id){
  const val = answers[id];
  if (Array.isArray(val)) return val.length > 0;
  return val !== undefined && val !== "";
}

function visibleQuestionIds(section){
  return section.qs.filter(id => {
    const q = QUESTIONS[id];
    if (q.skipIf && q.skipIf(answers)) return false;
    return true;
  });
}

function answeredCount(){
  return Object.keys(QUESTIONS).filter(id => {
    if (QUESTIONS[id].optional) return false;
    const q = QUESTIONS[id];
    if (q.skipIf && q.skipIf(answers)) return false;
    return isAnswered(id);
  }).length;
}

function sectionComplete(section){
  return visibleQuestionIds(section).every(id => {
    const q = QUESTIONS[id];
    if (q.optional) return true;
    return isAnswered(id);
  });
}

// Seiten, auf denen nach der Sprunglogik noch mindestens eine Frage übrig ist.
function pages(){
  return SECTIONS.filter(s => visibleQuestionIds(s).length > 0);
}

}

function render(){

  if (screen === "intro") app.innerHTML = renderIntro();
  else if (screen === "section") app.innerHTML = renderSection();

/* =========================================================
   Handlers
   ========================================================= */
function attachHandlers(){
  const startBtn = document.getElementById("startBtn");
  if (startBtn) startBtn.addEventListener("click", () => { screen = "section"; sectionIndex = 0; render(); });

  document.querySelectorAll(".box[data-q]").forEach(el => {
    el.addEventListener("click", () => {
      answers[el.getAttribute("data-q")] = parseInt(el.getAttribute("data-v"), 10);
      showError = false;
      render();
    });
  });

  document.querySelectorAll(".choice-row[data-q]").forEach(el => {
    el.addEventListener("click", () => {
      answers[el.getAttribute("data-q")] = el.getAttribute("data-choice");
      showError = false;
      render();
    });
  });

  document.querySelectorAll(".choice-row[data-multi]").forEach(el => {
    el.addEventListener("click", () => {
      const id = el.getAttribute("data-multi");
      const opt = el.getAttribute("data-choice");
      const cur = Array.isArray(answers[id]) ? answers[id].slice() : [];
      const pos = cur.indexOf(opt);
      if (pos === -1) cur.push(opt); else cur.splice(pos, 1);
      answers[id] = cur;
      showError = false;
      render();
    });
  });

  document.querySelectorAll("[data-qtext]").forEach(el => {
    el.addEventListener("input", (e) => {
      answers[el.getAttribute("data-qtext")] = e.target.value;
    });
  });

  const backBtn = document.getElementById("backBtn");
  if (backBtn) backBtn.addEventListener("click", () => { sectionIndex--; showError = false; render(); });

  const nextBtn = document.getElementById("nextBtn");
  if (nextBtn) nextBtn.addEventListener("click", () => {
    const P = pages();
    const section = P[sectionIndex];
    if (!sectionComplete(section)){ showError = true; render(); return; }
    showError = false;
    if (sectionIndex === P.length - 1){ submitSurvey(); }
    else { sectionIndex++; render(); }
  });
}

/* =========================================================
   Absenden an Formbricks
   ========================================================= */

// Sucht in der oeffentlichen Formbricks-Antwort die ID des Textfeldes.
function findFieldId(obj, depth){
  if (!obj || typeof obj !== "object" || depth > 8) return null;
  if (Array.isArray(obj)){
    for (const item of obj){
      const hit = findFieldId(item, depth + 1);
      if (hit) return hit;
    }
    return null;
  }
  if (obj.id === FORMBRICKS_SURVEY_ID){
    if (Array.isArray(obj.questions) && obj.questions.length && obj.questions[0].id) return obj.questions[0].id;
    if (Array.isArray(obj.blocks)){
      for (const b of obj.blocks){
        const els = b.elements || b.questions;
        if (Array.isArray(els) && els.length && els[0].id) return els[0].id;
      }
    }
  }
  for (const key of Object.keys(obj)){
    const hit = findFieldId(obj[key], depth + 1);
    if (hit) return hit;
  }
  return null;
}

async function discoverFieldId(){
  const urls = [
    `${FORMBRICKS_API_HOST}/api/v1/client/${FORMBRICKS_ENV_ID}/environment`,
    `${FORMBRICKS_API_HOST}/api/v2/client/${FORMBRICKS_ENV_ID}/environment`
  ];
  for (const url of urls){
    try{
      const res = await fetch(url);
      if (!res.ok) continue;
      const json = await res.json();
      const id = findFieldId(json, 0);
      if (id) return id;
    } catch(e){ /* naechste URL probieren */ }
  }
  return FORMBRICKS_FALLBACK_FIELD;
}

// Baut aus allen Antworten einen lesbaren und zugleich auswertbaren Text.
function buildAnswerText(){
  const lines = [];
  const kompakt = {};
  Object.keys(QUESTIONS).forEach(id => {
    const q = QUESTIONS[id];
    if (q.skipIf && q.skipIf(answers)){ lines.push(`${id}: (uebersprungen)`); return; }
    let val = answers[id];
    if (val === undefined || val === "" || (Array.isArray(val) && val.length === 0)){
      lines.push(`${id}: (keine Angabe)`);
      return;
    }
    if (Array.isArray(val)) val = val.join("; ");
    kompakt[id] = answers[id];
    lines.push(`${id}: ${val}   |   ${q.text}`);
  });
  return lines.join("\n") + "\n\n---DATEN---\n" + JSON.stringify(kompakt);
}

async function submitSurvey(){
  const nextBtn = document.getElementById("nextBtn");
  if (nextBtn){ nextBtn.disabled = true; nextBtn.innerText = "Wird gesendet ..."; }

  const fieldId = await discoverFieldId();
  const data = {};
  data[fieldId] = buildAnswerText();

  const body = { surveyId: FORMBRICKS_SURVEY_ID, finished: true, data: data };
  const endpoints = [
    `${FORMBRICKS_API_HOST}/api/v1/client/${FORMBRICKS_ENV_ID}/responses`,
    `${FORMBRICKS_API_HOST}/api/v2/client/${FORMBRICKS_ENV_ID}/responses`
  ];

  let ok = false, letzterFehler = "";
  for (const url of endpoints){
    try{
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      if (res.ok){ ok = true; break; }
      letzterFehler = "Status " + res.status;
    } catch(e){ letzterFehler = String(e); }
  }

  if (ok){
    screen = "done";
  } else {
    console.error("Absenden fehlgeschlagen", letzterFehler);
    if (nextBtn){ nextBtn.disabled = false; nextBtn.innerText = "Umfrage absenden"; }
    alert("Beim Absenden gab es ein Problem. Bitte versuchen Sie es in einem Moment noch einmal.");
  }
  render();
}

render();
